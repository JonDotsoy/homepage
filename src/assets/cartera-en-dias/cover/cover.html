<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>¿Cuántos días te quedan?</title>
    <meta
      name="description"
      content="Cover para ¿Cuántos días te quedan? — cuánto te alcanza tu saldo, medido en días"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #ffffff;
        --bg-2: #f0fdf4;
        --accent: #059669;
        --accent-2: #10b981;
        --text: #0f172a;
        --muted: #64748b;
        --line: rgba(15, 23, 42, 0.1);
        --tile-bg: #f4f6f4;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-1);
        font-family: var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
        padding-inline: 20px;
        padding-block: 48px;
      }

      .stage {
        width: 100%;
        max-width: 1040px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .cover {
        position: relative;
        width: 100%;
        aspect-ratio: 1200/630;
        border-radius: 20px;
        overflow: hidden;
        background:
          radial-gradient(
            900px 520px at 90% -14%,
            rgba(5, 150, 105, 0.1),
            transparent 58%
          ),
          radial-gradient(
            760px 520px at -10% 114%,
            rgba(16, 185, 129, 0.08),
            transparent 58%
          ),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        border: 1px solid var(--line);
        box-shadow: 0 40px 80px -30px rgba(15, 23, 42, 0.18);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 5vw, 48px);
        padding: clamp(32px, 6vw, 64px);
        text-align: center;
      }

      .new-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(5, 150, 105, 0.12);
        color: var(--accent);
        font-family: var(--mono);
        font-size: clamp(11px, 1.4vw, 13px);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .new-badge .led {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 8px 1px rgba(16, 185, 129, 0.6);
      }

      .heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 1.8vw, 16px);
      }

      .title {
        font-size: clamp(34px, 6.4vw, 64px);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text);
        line-height: 1.05;
      }

      .subtitle {
        font-size: clamp(15px, 2vw, 20px);
        color: var(--muted);
        white-space: nowrap;
      }

      .metric {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 1.8vw, 16px);
      }

      .metric-main {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .metric-days {
        font-family: var(--mono);
        font-size: clamp(72px, 13vw, 128px);
        font-weight: 800;
        line-height: 1;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .metric-label {
        font-size: clamp(14px, 2vw, 18px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        border-radius: 999px;
        background: rgba(5, 150, 105, 0.12);
        color: var(--accent);
        font-family: var(--mono);
        font-weight: 700;
        font-size: clamp(13px, 1.8vw, 16px);
      }
      .status-pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
      }

      .stat-grid {
        display: flex;
        gap: clamp(10px, 2vw, 16px);
      }

      .stat-tile {
        min-width: clamp(72px, 9vw, 104px);
        background: var(--tile-bg);
        border-radius: 12px;
        padding: clamp(10px, 1.6vw, 14px) clamp(14px, 2vw, 18px);
        text-align: center;
      }
      .stat-tile .n {
        font-family: var(--mono);
        font-weight: 800;
        font-size: clamp(18px, 2.4vw, 22px);
        color: var(--text);
      }
      .stat-tile .u {
        margin-top: 2px;
        font-size: clamp(9px, 1.1vw, 11px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      .footer {
        position: absolute;
        left: clamp(20px, 4vw, 36px);
        right: clamp(20px, 4vw, 36px);
        bottom: clamp(18px, 3vw, 28px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-family: var(--mono);
        font-size: clamp(12px, 1.5vw, 14px);
        color: var(--muted);
      }
      .footer .handle {
        color: var(--text);
        font-weight: 700;
      }

      .hint {
        font-family: var(--sans);
        font-size: 13px;
        color: #6b7480;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="cover">
        <span class="new-badge"><span class="led"></span>Nuevo</span>

        <div class="heading">
          <div class="title">¿Cuántos días te quedan?</div>
          <p class="subtitle">Cuánto te alcanza tu saldo, medido en días.</p>
        </div>

        <div class="metric">
          <div class="metric-main">
            <span class="metric-days">128</span>
            <span class="metric-label">días de reserva</span>
          </div>
          <span class="status-pill"
            ><span class="dot"></span>Reserva saludable</span
          >
          <div class="stat-grid">
            <div class="stat-tile">
              <div class="n">128</div>
              <div class="u">Días</div>
            </div>
            <div class="stat-tile">
              <div class="n">4.3</div>
              <div class="u">Meses</div>
            </div>
            <div class="stat-tile">
              <div class="n">0.35</div>
              <div class="u">Años</div>
            </div>
          </div>
        </div>

        <div class="footer">
          <span class="handle">jondotsoy</span>
          <span>jon.soy/tools/cartera-en-dias</span>
        </div>
      </div>

      <p class="hint">Cover 1200×630 — se ve completo a cualquier ancho</p>
    </div>
  </body>
</html>
